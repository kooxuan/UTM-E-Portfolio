<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - What's Happening UTM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <div class="auth-container">
        <div class="auth-header">
			<img src="logo.jpg" alt="Debuggers Logo">
            <h1>What's Happening UTM</h1>
            <p>Create Your Account</p>
        </div>
        
        <div id="message"></div>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="email">UTM Email:</label>
                <input type="email" id="email" name="email" placeholder="student@graduate.utm.my" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            
            <button type="submit" class="btn">Create Account</button>
        </form>
        
        <div class="auth-links">
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </div>
    
    <script src="auth.js"></script>
</main>
</body>
</html>
